<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Image placée en haut hors de la div -->
  <div class="image-container">
    <img src="1.png" alt="Login Image">
  </div>

  <!-- Div contenant le formulaire de connexion -->
  <div class="login-form">
    <h2>Se Connecter</h2>
    <form id="loginForm">
      <input type="text" name="username" id="username" placeholder="Votre adresse email" required>
      <input type="password" name="mdp" id="mdp" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
    <p class="info-text">Informations du compte ou Cookies</p>
    <button class="create-account">Créer un compte</button>
  </div>

  <!-- Lien vers le fichier JavaScript externe -->
  <script src="ind.js"></script>
</body>
</html>
