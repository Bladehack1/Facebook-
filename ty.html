<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Conteneur principal -->
  <div class="container">
    <!-- Spinner -->
    <div id="spinner" class="spinner"></div>
    <!-- Message caché par défaut -->
    <div id="message" class="hidden">
      <h1>Succès !</h1>
      <p>Vos informations ont été mises à jour. Veuillez vous reconnecter.</p>
      <button id="reconnect-btn">Me reconnecter</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
